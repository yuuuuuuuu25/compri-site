name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://compri.jp
  BASE_PATH: /

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: npm run build
